<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPACE</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: #ffffff;
  color: #0a1a3f;
}

/* HEADER */
header {
  background: #0a1a3f;
  padding: 20px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  color: #fff;
  letter-spacing: 4px;
}

nav a {
  color: #fff;
  margin-left: 30px;
  text-decoration: none;
  opacity: 0.85;
}

nav a:hover {
  opacity: 1;
}

/* LOGIN */
.login-box {
  max-width: 350px;
  margin: 80px auto;
  text-align: center;
  border: 1px solid #e3e7f3;
  border-radius: 16px;
  padding: 40px;
}

.login-box input {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border-radius: 10px;
  border: 1px solid #cdd4ea;
}

.login-box button {
  margin-top: 20px;
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #0a1a3f;
  color: #fff;
  cursor: pointer;
}

/* MAIN */
.container {
  display: none;
  max-width: 900px;
  margin: 60px auto;
  text-align: center;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 30px;
  margin-top: 50px;
}

.card {
  border: 1px solid #e4e8f3;
  border-radius: 18px;
  padding: 40px 30px;
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-6px);
  border-color: #0a1a3f;
}

/* GIFT ANIMATION */
.gift {
  font-size: 50px;
  animation: float 2s infinite ease-in-out;
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
  100% { transform: translateY(0); }
}

/* BATTLE PROGRESS */
.progress-box {
  margin-top: 25px;
  background: #eef1fb;
  border-radius: 20px;
  overflow: hidden;
}

.progress {
  height: 18px;
  width: 0%;
  background: #0a1a3f;
  transition: width 0.5s;
}

button.battle-btn {
  margin-top: 20px;
  padding: 10px 25px;
  border-radius: 10px;
  border: none;
  background: #0a1a3f;
  color: #fff;
  cursor: pointer;
}

footer {
  margin: 80px 0 30px;
  text-align: center;
  font-size: 14px;
  color: #7a86a8;
}
</style>
</head>

<body>

<header>
  <h1>SPACE</h1>
  <nav>
    <a href="#">Gifts</a>
    <a href="#">Battle</a>
  </nav>
</header>

<!-- LOGIN -->
<div class="login-box" id="login">
  <h2>Login</h2>
  <input type="text" id="username" placeholder="Enter username">
  <button onclick="login()">Enter SPACE</button>
</div>

<!-- MAIN -->
<div class="container" id="main">
  <h2 id="welcome"></h2>
  <p>Minimal • Clean • Competitive</p>

  <div class="cards">
    <!-- GIFTS -->
    <div class="card">
      <div class="gift">🎁</div>
      <h3>Gifts</h3>
      <span>Animated digital gifts</span>
    </div>

    <!-- BATTLE -->
    <div class="card">
      <h3>⚔️ Battle</h3>
      <span>Win battles and earn progress</span>

      <div class="progress-box">
        <div class="progress" id="progress"></div>
      </div>

      <button class="battle-btn" onclick="battle()">Fight</button>
    </div>
  </div>
</div>

<footer>
  © 2025 SPACE
</footer>

<script>
let progress = 0;

function login() {
  const user = document.getElementById("username").value;
  if (!user) return;

  document.getElementById("login").style.display = "none";
  document.getElementById("main").style.display = "block";
  document.getElementById("welcome").innerText = "Welcome, " + user;
}

function battle() {
  if (progress < 100) {
    progress += 20;
    document.getElementById("progress").style.width = progress + "%";
  }
}
</script>

</body>
</html>
