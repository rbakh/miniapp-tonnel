<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUETA Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: radial-gradient(circle at top, #1a1a1a, #000000);
      color: #fff;
      height: 100vh;
      overflow-x: hidden;
    }

    .header {
      padding: 25px;
      text-align: center;
    }

    .title {
      font-size: 42px;
      font-weight: 900;
      color: #ff007f;
      text-shadow: 0 0 25px rgba(255, 0, 150, 0.6);
      animation: glow 2.5s infinite;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 15px rgba(255,0,150,0.6); }
      50% { text-shadow: 0 0 35px rgba(255,0,150,1); }
      100% { text-shadow: 0 0 15px rgba(255,0,150,0.6); }
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      padding: 20px;
    }

    .menu-item {
      background: rgba(255, 255, 255, 0.06);
      padding: 20px;
      border-radius: 18px;
      text-align: center;
      font-size: 18px;
      backdrop-filter: blur(12px);
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 0, 120, 0.18);
      transition: 0.3s;
    }

    .menu-item:hover {
      background: rgba(255, 0, 130, 0.25);
      transform: scale(1.05);
    }

    .game-box {
      padding: 20px;
      margin: 20px;
      background: rgba(255,255,255,0.07);
      border-radius: 18px;
      display: none;
      box-shadow: 0 0 20px rgba(255,0,130,0.25);
      text-align: center;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      font-size: 18px;
      border: none;
      border-radius: 14px;
      background: #ff007f;
      color: white;
      font-weight: 700;
      box-shadow: 0 0 18px rgba(255,0,130,0.7);
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ff3aa1;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="title">SUETA</div>
  </div>

  <div class="menu">
    <div class="menu-item" onclick="openAPI()">API</div>
    <div class="menu-item" onclick="openGame()">Game</div>
    <div class="menu-item" onclick="sendStart()">Start</div>
    <div class="menu-item" onclick="info()">Info</div>
  </div>

  <div id="game" class="game-box">
    <h2>Мини‑игра SUETA</h2>
    <p>Нажми кнопку и поймай число 1–5!</p>
    <button onclick="playGame()">Играть</button>
    <p id="gameResult" style="margin-top:15px;font-size:20px;"></p>
  </div>

  <script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    function sendStart() {
      tg.sendData("sueta_start_pressed");
    }

    function openAPI() {
      tg.sendData("sueta_open_api");
    }

    function info() {
      tg.sendData("sueta_info_request");
    }

    function openGame() {
      document.getElementById("game").style.display = "block";
    }

    function playGame() {
      let num = Math.floor(Math.random() * 5) + 1;
      document.getElementById("gameResult").innerText = "Твоё число: " + num;
      tg.sendData("sueta_game_num_" + num);
    }
  </script>
</body>
</html>
