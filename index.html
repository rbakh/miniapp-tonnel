<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonnel Network Bot</title>
    <style>
        :root {
            --primary-color: #0088cc;
            --secondary-color: #f0f0f0;
            --text-color: #333333;
            --light-text: #666666;
            --border-color: #e0e0e0;
            --success-color: #4caf50;
            --error-color: #f44336;
            --bg-color: #ffffff;
            --chat-bg: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .logo h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .status {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success-color);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: var(--chat-bg);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bot-message {
            align-self: flex-start;
            background-color: white;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--primary-color);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 12px;
            opacity: 0.7;
            text-align: right;
            margin-top: 5px;
        }

        .input-container {
            padding: 15px 20px;
            background-color: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            outline: none;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .message-input:focus {
            border-color: var(--primary-color);
        }

        .send-button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .send-button:hover {
            background-color: #0077b3;
        }

        .send-button svg {
            width: 20px;
            height: 20px;
        }

        .keyboard {
            padding: 10px 20px;
            background-color: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .keyboard-button {
            padding: 10px 15px;
            background-color: var(--secondary-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .keyboard-button:hover {
            background-color: #e0e0e0;
        }

        .keyboard-button.primary {
            background-color: var(--primary-color);
            color: white;
        }

        .keyboard-button.primary:hover {
            background-color: #0077b3;
        }

        .menu {
            display: flex;
            gap: 20px;
            padding: 15px 20px;
            background-color: white;
            border-top: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            min-width: 60px;
        }

        .menu-icon {
            width: 24px;
            height: 24px;
            opacity: 0.7;
        }

        .menu-text {
            font-size: 12px;
            text-align: center;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 12px 16px;
            background-color: white;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            max-width: 80px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--light-text);
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-5px);
            }
        }

        @media (max-width: 480px) {
            .message {
                max-width: 90%;
            }
            
            .header {
                padding: 12px 15px;
            }
            
            .chat-container {
                padding: 15px;
            }
            
            .input-container {
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="https://via.placeholder.com/40" alt="Tonnel Network Bot">
                <h1>Tonnel Network Bot</h1>
            </div>
            <div class="status">
                <div class="status-dot"></div>
                <span>Online</span>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message bot-message">
                <p>Привет! Я Tonnel Network Bot. Чем могу помочь?</p>
                <div class="message-time">12:00</div>
            </div>
            
            <div class="message user-message">
                <p>Хочу узнать о возможностях бота</p>
                <div class="message-time">12:01</div>
            </div>
            
            <div class="message bot-message">
                <p>Я могу помочь с:</p>
                <p>• Управлением сетью</p>
                <p>• Мониторингом соединений</p>
                <p>• Настройкой параметров</p>
                <p>• Статистикой использования</p>
                <div class="message-time">12:02</div>
            </div>
            
            <div class="typing-indicator" id="typingIndicator" style="display: none;">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>

        <div class="keyboard" id="keyboard">
            <button class="keyboard-button">Сеть</button>
            <button class="keyboard-button">Статистика</button>
            <button class="keyboard-button">Настройки</button>
            <button class="keyboard-button primary">Помощь</button>
        </div>

        <div class="input-container">
            <input type="text" class="message-input" id="messageInput" placeholder="Введите сообщение...">
            <button class="send-button" id="sendButton">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>

        <div class="menu">
            <div class="menu-item">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-6h2v6zm4 0h-2V9h2v8z"/>
                </svg>
                <span class="menu-text">Статус</span>
            </div>
            <div class="menu-item">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
                </svg>
                <span class="menu-text">Аналитика</span>
            </div>
            <div class="menu-item">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <span class="menu-text">Профиль</span>
            </div>
            <div class="menu-item">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                </svg>
                <span class="menu-text">Безопасность</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatContainer = document.getElementById('chatContainer');
            const messageInput = document.getElementById('messageInput');
            const sendButton = document.getElementById('sendButton');
            const keyboard = document.getElementById('keyboard');
            const typingIndicator = document.getElementById('typingIndicator');
            
            // Функция для добавления сообщения в чат
            function addMessage(text, isUser = false) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
                
                const messageText = document.createElement('p');
                messageText.textContent = text;
                
                const messageTime = document.createElement('div');
                messageTime.className = 'message-time';
                const now = new Date();
                messageTime.textContent = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
                
                messageDiv.appendChild(messageText);
                messageDiv.appendChild(messageTime);
                
                chatContainer.insertBefore(messageDiv, typingIndicator);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
            
            // Функция для имитации ответа бота
            function botReply(userMessage) {
                // Показать индикатор набора текста
                typingIndicator.style.display = 'flex';
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
                // Имитация задержки ответа
                setTimeout(() => {
                    typingIndicator.style.display = 'none';
                    
                    let reply = "Извините, я не понял ваш запрос. Попробуйте использовать кнопки ниже.";
                    
                    if (userMessage.toLowerCase().includes('привет') || userMessage.toLowerCase().includes('здравствуй')) {
                        reply = "Привет! Рад вас видеть. Чем могу помочь?";
                    } else if (userMessage.toLowerCase().includes('статистика')) {
                        reply = "Статистика использования сети:\n• Активных соединений: 12\n• Передано данных: 2.4 ГБ\n• Средняя скорость: 45 Мбит/с";
                    } else if (userMessage.toLowerCase().includes('настройки')) {
                        reply = "Настройки сети:\n• Автозапуск: Включен\n• Безопасность: Высокий уровень\n• Уведомления: Активны";
                    } else if (userMessage.toLowerCase().includes('помощь')) {
                        reply = "Доступные команды:\n• /start - Начать работу\n• /status - Статус сети\n• /stats - Статистика\n• /settings - Настройки\n• /help - Помощь";
                    }
                    
                    addMessage(reply, false);
                }, 1500);
            }
            
            // Обработчик отправки сообщения
            function sendMessage() {
                const message = messageInput.value.trim();
                if (message) {
                    addMessage(message, true);
                    messageInput.value = '';
                    botReply(message);
                }
            }
            
            // Обработчики событий
            sendButton.addEventListener('click', sendMessage);
            
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            // Обработчики для кнопок клавиатуры
            const keyboardButtons = keyboard.querySelectorAll('.keyboard-button');
            keyboardButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const buttonText = this.textContent;
                    addMessage(buttonText, true);
                    botReply(buttonText);
                });
            });
            
            // Обработчики для меню
            const menuItems = document.querySelectorAll('.menu-item');
            menuItems.forEach(item => {
                item.addEventListener('click', function() {
                    const menuText = this.querySelector('.menu-text').textContent;
                    addMessage(`Открыть раздел: ${menuText}`, true);
                    botReply(menuText);
                });
            });
        });
    </script>
</body>
</html>
